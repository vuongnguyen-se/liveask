# Local development: the API plus PostgreSQL, no AWS needed.
#   docker compose up --build   ->  http://localhost:8000/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes-local-only
      POSTGRES_DB: notes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes"]
      interval: 3s
      retries: 10

  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql://notes:notes-local-only@db:5432/notes
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
