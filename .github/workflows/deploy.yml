# Manual deploy of the image: the cluster only exists while you are running the lab,
# so this runs on demand instead of on every push. It builds and pushes the image to ECR;
# scripts/deploy-from-laptop.sh then applies the manifests (see the last step for why).
#
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_DEPLOY_ROLE_ARN  terraform output github_deploy_role_arn
#   ECR_REPOSITORY_URL   terraform output ecr_repository_url
name: Deploy to EKS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets the job request a GitHub OIDC token for AWS

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` here: it would change the OIDC subject to
    # repo:<owner>/<repo>:environment:<name>, and the IAM trust policy expects ref:refs/heads/main.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image tagged with the commit SHA
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
        run: |
          docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t "$IMAGE" app
          docker push "$IMAGE"

      - name: Tell where the image is and how to apply it
        # The cluster API is locked to one IP (cluster_endpoint_public_access_cidrs), so a GitHub-hosted
        # runner cannot reach it. The manifests are applied from the machine on that IP.
        run: |
          {
            echo "Image pushed: \`${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}\`"
            echo
            echo "Apply it from your laptop (on the allowed IP, signed in to AWS):"
            echo
            echo "\`\`\`"
            echo "bash scripts/deploy-from-laptop.sh ${{ github.sha }}"
            echo "\`\`\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
