name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App tests and image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: liveask
          POSTGRES_PASSWORD: liveask-ci-only
          POSTGRES_DB: liveask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liveask" --health-interval 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://liveask:liveask-ci-only@localhost:5432/liveask
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Build image (not pushed)
        run: docker build -t liveask:ci .

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate -no-color

  manifests:
    name: Kubernetes manifests render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: kubectl kustomize k8s/overlays/aws > /dev/null
      - run: kubectl kustomize k8s/overlays/local > /dev/null
