<!doctype html>
<html lang="en" data-type="software" data-radius="round" data-buttons="tonal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveAsk</title>
<meta name="theme-color" content="#f7f9fa">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/host-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/assets/system.css">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="app" data-view="audience">
  <header class="app-bar">
    <div class="app-wrap app-bar__row">
      <a class="app-brand" href="/"><span class="mark mark--initial" aria-hidden="true">L</span>LiveAsk</a>
      <span id="status" class="pill" role="status">connecting…</span>
    </div>
  </header>
  <main class="app-wrap">
    <h1 id="title" class="app-title">LiveAsk</h1>
    <div id="closed" class="banner" role="status" hidden>This room is closed. Questions and votes are off.</div>
    <div id="missing" class="banner" role="alert" hidden>No room has this code. Check the 6 characters on the screen.</div>

    <form id="ask" class="card ask" novalidate>
      <div class="field">
        <label for="text">Ask a question</label>
        <textarea id="text" maxlength="280" required></textarea>
      </div>
      <div class="ask__row">
        <div class="field ask__name">
          <label for="name">Your name (optional)</label>
          <input id="name" maxlength="40" autocomplete="nickname">
        </div>
        <span id="count" class="muted">0/280</span>
        <button class="btn btn--primary" type="submit">Ask</button>
      </div>
      <p id="ask-error" class="error" role="alert"></p>
    </form>

    <div id="polls" aria-label="Polls"></div>

    <h2 class="app-h2">Questions</h2>
    <ul id="questions" class="list"></ul>
    <p id="empty" class="muted" hidden>No questions yet. Ask the first one.</p>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
