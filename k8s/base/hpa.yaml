# Adds pods when average CPU passes 60% of the request (needs metrics-server).
# Try it with scripts/load_test.py.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: liveask
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: liveask
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
