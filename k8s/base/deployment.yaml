apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveask
  labels:
    app: liveask
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: liveask
  # Zero-downtime update: a new pod must be Ready before an old one is stopped.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: liveask
    spec:
      automountServiceAccountToken: false
      # Time for the preStop sleep, then the app closing its WebSockets (code 1012), then exit.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across Availability Zones when possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: liveask
      initContainers:
        # Applies schema.sql under a Postgres advisory lock, so pods starting together take
        # turns. Same image as the app (D-007). Retried by Kubernetes until the database is up.
        - name: migrate
          image: liveask
          command: ["python", "-m", "liveask.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: liveask-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: liveask
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: liveask-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: liveask-db
                  key: DATABASE_URL
            # Shown in the "live · pod ..." badge, so the multi-pod demo is visible.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          # Liveness never touches the database: a database outage must not restart every pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Readiness needs the database and the LISTEN connection; it is 503 while shutting down.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          lifecycle:
            preStop:
              # Keep serving for 10 s after the pod is marked for deletion, so the load balancer
              # stops sending new connections before the app begins to shut down.
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
