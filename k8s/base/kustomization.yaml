apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: liveask
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: liveask
images:
  - name: liveask
    newName: liveask
    newTag: local
