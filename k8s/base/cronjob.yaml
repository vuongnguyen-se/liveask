# Nightly: deletes rooms past their 24 hours (and their questions, votes and polls).
# concurrencyPolicy Forbid: if a run is still going at the next time, the next one is skipped.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: liveask-cleanup
spec:
  schedule: "0 3 * * *"          # 03:00 UTC every day
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300  # a stuck run is stopped after 5 minutes
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: liveask
              command: ["python", "-m", "liveask.cleanup"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: liveask-db
                      key: DATABASE_URL
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
