# PostgreSQL for minikube only. On AWS, RDS replaces this (D-010).
# A StatefulSet gives the pod a stable name (postgres-0) and its own volume that survives
# pod restarts: delete the pod and the data is still there.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None              # headless: DNS name "postgres" points straight at postgres-0
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70            # the postgres user in the alpine image
        fsGroup: 70              # lets that user write to the volume
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: liveask
            - name: POSTGRES_DB
              value: liveask
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: PGDATA       # a subfolder: the volume's root holds a lost+found directory
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "liveask", "-d", "liveask"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "liveask", "-d", "liveask"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql   # the unix socket directory (root filesystem is read-only)
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
