# For kind / minikube: no ALB, one replica, image loaded with `kind load docker-image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: notes-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
