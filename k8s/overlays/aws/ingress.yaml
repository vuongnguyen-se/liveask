# The AWS Load Balancer Controller creates an internet-facing ALB for this Ingress
# and sends traffic straight to pod IPs (target-type ip).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: liveask
  namespace: liveask
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /readyz
    alb.ingress.kubernetes.io/tags: Project=liveask
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: liveask
                port:
                  name: http
