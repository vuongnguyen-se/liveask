# Local stand-in for the AWS load balancer: spreads connections over two app containers
# ("pods"), round robin, no sticky sessions. WebSocket upgrades are passed through.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Docker's DNS: lets nginx notice when a container comes back with a new address.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream liveask {
    zone liveask 64k;   # share the round-robin state between nginx workers, so it alternates evenly
    # resolve: names are looked up again every few seconds (nginx 1.27.3 or newer), so a
    # container that comes back with a new address is found without restarting nginx.
    # A peer that fails once is left out for 3 s, then tried again.
    server api1:8000 resolve max_fails=1 fail_timeout=3s;
    server api2:8000 resolve max_fails=1 fail_timeout=3s;
}

server {
    listen 80;

    location / {
        proxy_pass http://liveask;
        proxy_http_version 1.1;                       # WebSockets need HTTP/1.1
        proxy_connect_timeout 2s;                     # a stopped container does not answer at all: try the other one after 2 s, not 60 s
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;                     # a talk can last an hour (ALB idle timeout on AWS)
        proxy_send_timeout 3600s;
        add_header X-Upstream $upstream_addr always;  # shows which container answered
    }
}
