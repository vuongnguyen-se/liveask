# Local stand-in for the AWS load balancer: spreads connections over two app containers
# ("pods"), round robin, no sticky sessions. WebSocket upgrades are passed through.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream liveask {
    zone liveask 64k;   # share the round-robin state between nginx workers, so it alternates evenly
    server api1:8000;
    server api2:8000;
}

server {
    listen 80;

    location / {
        proxy_pass http://liveask;
        proxy_http_version 1.1;                       # WebSockets need HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;                     # a talk can last an hour (ALB idle timeout on AWS)
        proxy_send_timeout 3600s;
        add_header X-Upstream $upstream_addr always;  # shows which container answered
    }
}
